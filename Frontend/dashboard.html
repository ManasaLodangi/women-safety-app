<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Women Safety App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container dashboard">
    <h2 id="welcomeMsg">Welcome!</h2>

    <button id="sosBtn" class="sos-button">🚨 SOS - Send Alert</button>
    <div id="sosMessage" class="sos-message"></div>
<div id="whatsappButtons"></div>
    <form id="contactForm">
        <input type="text" id="contactName" placeholder="Contact Name" required>
        <input type="tel" id="contactPhone" placeholder="Contact Phone" required>
        <input type="text" id="relationship" placeholder="Relationship (e.g. Mother, Friend)" required>
        <button type="submit">Add Contact</button>
    </form>
<div class="contacts-header">
    <h3 style="margin:0;">Emergency Contacts</h3>
    <button id="deleteSelectedBtn" class="trash-icon-btn" title="Delete selected">🗑️</button>
</div>
<ul id="contactsList"></ul>
    <button id="logoutBtn">Logout</button>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
